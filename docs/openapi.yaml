openapi: 3.1.0
info:
  title: ReSource PK API
  version: 1.4.0
  description: Auth, seller approval, organization permissions, catalog, and direct/group purchase lifecycle contract.
servers:
  - url: /api/v1
paths:
  /internal/storage-cleanup:
    get:
      summary: Process one bounded batch of private image cleanup jobs
      description: Scheduler-only endpoint. CRON_SECRET is separate from user JWTs. Not cached. Failed objects remain queued for the next invocation.
      security:
        - cronAuth: []
      responses:
        "200":
          description: Batch completed; data contains queued, removed and failed counts (maximum 20 jobs).
        "401":
          description: CRON_SECRET is absent or scheduler authorization is invalid.
        "503":
          description: Storage is not configured or one or more objects could not be cleaned.
        "500":
          description: Cleanup could not complete; inspect the correlation ID in backend logs.
  /internal/purchase-expiry:
    get:
      summary: Expire overdue direct orders and unpaid group contributions
      description: Scheduler-only, CRON_SECRET protected, bounded to 100 orders per invocation. Under-target groups are left for the Seller's expire-or-confirm decision.
      security:
        - cronAuth: []
      responses:
        "200":
          description: Counts of direct Seller timeouts and Buyer payment timeouts.
        "401":
          description: CRON_SECRET is absent or scheduler authorization is invalid.
  /auth/register:
    post:
      summary: Register a Buyer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Account created; email verification required
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          description: Seller registration is disabled; use a Buyer account to request Seller access for platform review
        "422":
          $ref: "#/components/responses/Validation"
  /auth/verify-email:
    post:
      summary: Consume a single-use email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Token"
      responses:
        "200":
          description: Email verified
        "400":
          $ref: "#/components/responses/BadToken"
  /auth/resend-verification:
    post:
      summary: Request a replacement verification email
      responses:
        "200":
          description: Generic response prevents account discovery
  /auth/login:
    post:
      summary: Start a rotating session
      responses:
        "200":
          description: Access token and role context; refresh token in HttpOnly cookie
        "401":
          description: Invalid credentials
        "403":
          description: Email or account unavailable
  /auth/google:
    post:
      summary: Sign in or create a baseline Buyer account with Google Identity Services
      description: The API verifies the Google ID token against GOOGLE_CLIENT_ID. It creates or reuses the person's canonical account; seller organization membership still requires approval. Refresh token is set in an HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredential"
      responses:
        "202":
          description: Additional ReSource PK email verification is required; no session is created
        "200":
          description: Access token and current account context; refresh token in HttpOnly cookie
        "401":
          description: Invalid, expired, or unverified Google credential
        "409":
          description: Existing account must authenticate and explicitly link Google
        "503":
          description: Google sign-in is not configured or verification is temporarily unavailable
  /auth/google/nonce:
    get:
      summary: Issue a five-minute, single-use nonce for Google sign-in
      responses:
        "200":
          description: No-store response containing the nonce to pass into Google Identity Services
        "503":
          description: Google sign-in is not configured
  /auth/google/seller:
    post:
      summary: Sign in through the Seller Google entry point
      description: Reuses the same canonical user and Google identity as Buyer sign-in. This authenticates the user through the separate Seller entry point; it does not submit a Seller request or create an organization. Submit a Seller application through POST /seller/requests. Approval adds Owner membership without removing Buyer access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerGoogleCredential"
      responses:
        "200":
          description: Canonical account session with current memberships and request context available through the request history endpoint
        "202":
          description: Additional ReSource PK email verification is required
        "401":
          description: Invalid, expired, or unverified Google credential
        "409":
          description: Existing account must authenticate and explicitly link Google
  /auth/google/seller/nonce:
    get:
      summary: Issue a five-minute, single-use nonce for the Seller entry point
      responses:
        "200":
          description: No-store response containing the Seller sign-in nonce
        "503":
          description: Google sign-in is not configured
  /auth/google/link:
    post:
      security:
        - bearerAuth: []
      summary: Link a verified Google identity to the authenticated matching account
      description: Requires a live ReSource PK session and the same verified email on the Google ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredential"
      responses:
        "200":
          description: Google identity linked (or already linked to this account)
        "401":
          description: Authentication required or Google credential invalid
        "403":
          description: Account is unavailable or verified emails do not match
        "409":
          description: Google identity is linked to another account or this account already has another Google identity
  /auth/google/link/nonce:
    get:
      security:
        - bearerAuth: []
      summary: Issue a five-minute, single-use nonce bound to the authenticated account for Google linking
      responses:
        "200":
          description: No-store response containing the account-bound nonce
        "401":
          description: Authentication required
  /auth/refresh:
    post:
      summary: Rotate the refresh session
      responses:
        "200":
          description: New access token and role context
        "401":
          description: Session expired
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          description: Exact configured frontend origin
        - in: header
          name: X-ReSourcePK-CSRF
          required: true
          schema:
            type: string
            const: "1"
  /auth/logout:
    post:
      summary: Revoke the current refresh session
      responses:
        "204":
          description: Signed out
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          description: Exact configured frontend origin
        - in: header
          name: X-ReSourcePK-CSRF
          required: true
          schema:
            type: string
            const: "1"
  /auth/forgot-password:
    post:
      summary: Request a one-hour password-reset link
      responses:
        "200":
          description: Generic response prevents account discovery
  /auth/reset-password:
    post:
      summary: Set a new password and revoke all sessions
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadToken"
  /auth/me:
    get:
      security:
        - bearerAuth: []
      summary: Return user, organization memberships, and platform roles
      responses:
        "200":
          description: Current access context
        "401":
          description: Authentication required
  /seller/requests:
    post:
      security:
        - bearerAuth: []
      summary: Submit a Seller organization application
      description: An active, verified account may apply. Submitting a request does not grant organization membership or Seller permissions. A Platform Reviewer with seller_requests.review or Platform Admin must approve it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  applicantName,
                  cnicNumber,
                  organizationName,
                  contactNumber,
                  businessAddress,
                ]
              properties:
                applicantName:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: Applicant name, prefilled from the Google account and editable by the applicant
                cnicNumber:
                  type: string
                  pattern: "^(?:[0-9]{13}|[0-9]{5}-[0-9]{7}-[0-9]|[0-9]{5} [0-9]{7} [0-9])$"
                  description: Pakistan CNIC number; encrypted at rest and returned in full only to authorized Seller request reviewers
                organizationName:
                  type: string
                  minLength: 2
                  maxLength: 180
                  description: Company or mill name
                contactNumber:
                  type: string
                  minLength: 7
                  maxLength: 32
                businessAddress:
                  type: string
                  minLength: 5
                  maxLength: 500
              additionalProperties: false
      responses:
        "201":
          description: New request queued for platform review
        "200":
          description: Existing pending request details updated
        "401":
          description: Authentication required
        "403":
          description: Active verified account required
        "409":
          description: Seller access already granted
        "503":
          description: Seller request encryption key is not configured
  /seller/requests/mine:
    get:
      security:
        - bearerAuth: []
      summary: List the authenticated user's Seller access requests
      responses:
        "200":
          description: Request history, including decision and reviewer note
  /platform/seller-requests:
    get:
      security:
        - bearerAuth: []
      summary: List Seller access requests for a Reviewer with seller_requests.review or a Platform Admin
      description: Full CNIC numbers are returned only from this permission-checked review endpoint. Requests created before CNIC collection may not have a value.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Request queue and review history
        "403":
          description: seller_requests.review permission or Platform Admin access required
  /platform/seller-requests/{requestId}/decision:
    post:
      security:
        - bearerAuth: []
      summary: Approve or reject a pending Seller access request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                reviewNote:
                  type: string
                  maxLength: 1000
              additionalProperties: false
      responses:
        "200":
          description: Request decided; approval creates an organization and Owner membership
        "403":
          description: seller_requests.review permission or Platform Admin access required
        "404":
          description: Request not found
        "409":
          description: Request already reviewed, application details are incomplete, or applicant unavailable
  /platform/reviewers:
    post:
      security:
        - bearerAuth: []
      summary: Invite a Platform Reviewer and grant selected permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                permissions:
                  type: array
                  uniqueItems: true
                  default: []
                  items:
                    type: string
                    enum: [seller_requests.review, listings.review]
              additionalProperties: false
      responses:
        "201":
          description: Invitation emailed by a Platform Admin; permissions take effect after acceptance
        "403":
          description: Platform Admin access required
  /platform/reviewer-invitations/accept-new:
    post:
      summary: Create an account and accept a Platform Reviewer invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, fullName, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 200 }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                password: { type: string, minLength: 10, maxLength: 72 }
              additionalProperties: false
      responses:
        "201":
          description: Reviewer account created and invited permissions activated
        "400":
          description: Invitation is invalid or expired
  /platform/reviewer-invitations/details:
    get:
      summary: Read the email and permissions attached to a Reviewer invitation
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string, minLength: 32, maxLength: 200 }
      responses:
        "200":
          description: Invitation details
        "400":
          description: Invitation is invalid or expired
  /platform/reviewer-invitations/accept:
    post:
      security:
        - bearerAuth: []
      summary: Accept a Platform Reviewer invitation for the signed-in verified email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 200 }
              additionalProperties: false
      responses:
        "200":
          description: Reviewer assignment and invited permissions activated
        "403":
          description: Signed-in verified email does not match the invitation
  /platform/reviewers/{userId}/permissions:
    put:
      security:
        - bearerAuth: []
      summary: Replace a Reviewer's platform permissions
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [seller_requests.review, listings.review]
              additionalProperties: false
      responses:
        "200":
          description: Permissions replaced by a Platform Admin
        "403":
          description: Platform Admin access required
        "404":
          description: Platform Reviewer not found
  /platform/reviewers/{userId}:
    delete:
      security:
        - bearerAuth: []
      summary: Revoke Platform Reviewer role
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reviewer role revoked by a Platform Admin
        "403":
          description: Platform Admin access required
        "404":
          description: Platform Reviewer not found
  /organizations:
    post:
      security:
        - bearerAuth: []
      summary: Retired direct organization creation endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 180
      responses:
        "403":
          description: Submit a Seller access request and wait for platform approval
  /organizations/{organizationId}/invitations:
    post:
      security: &id001
        - BearerAuth: []
      summary: Invite a manager or staff member
      description: Owners can invite Managers and Staff. A Manager with can_invite_staff can invite Staff. A Staff invitation may include staffPermissions containing listings.view and/or listings.manage; permission changes can also be made through the member permissions endpoint.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [manager, staff]
                canInviteStaff:
                  type: boolean
                  default: false
                  description: Owner-granted Manager permission to invite Staff.
                staffPermissions:
                  type: array
                  items:
                    type: string
                    enum: [listings.view, listings.manage]
                  description: Optional Staff grants; omitted means no organization listing access.
      responses:
        "201":
          description: Single-use invitation sent
        "403":
          description: Membership cannot grant requested role
  /organizations/{organizationId}/members:
    get:
      security: *id001
      summary: List organization members and their effective grants
      description: Available to the Owner or a Manager with can_invite_staff.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Members with membershipId, role and permissions
        "403":
          description: Owner or authorized Manager access required
  /organizations/{organizationId}/members/{membershipId}/permissions:
    patch:
      security: *id001
      summary: Replace permissions granted to an active Staff member
      description: An Owner or a Manager with can_invite_staff may grant or revoke Staff permissions. listings.manage also allows listing reads.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              additionalProperties: false
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [listings.view, listings.manage]
      responses:
        "200":
          description: Staff permissions replaced
        "403":
          description: Owner or authorized Manager access required
  /organizations/{organizationId}/managers/{membershipId}/permissions:
    patch:
      security: *id001
      summary: Grant or revoke a Manager's order-confirmation permission
      description: Only the organization Owner may set the Manager's orders.confirm grant. Staff cannot receive this permission.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: membershipId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              additionalProperties: false
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  maxItems: 1
                  items: { type: string, enum: [orders.confirm] }
      responses:
        "200":
          description: Manager permission set replaced and audited.
        "403":
          description: Active Owner access required.
        "404":
          description: Active Manager membership not found.
  /invitations/details:
    get:
      summary: Read non-sensitive invitation context
      responses:
        "200":
          description: Organization
          email: null
          role and expiry: null
  /invitations/accept-new:
    post:
      summary: Create an account from an invitation and join the organization
      responses:
        "201":
          description: Invitation accepted
        "409":
          description: Existing users must sign in
  /invitations/accept:
    post:
      security:
        - bearerAuth: []
      summary: Accept an invitation for the signed-in email
      responses:
        "200":
          description: Invitation accepted
        "403":
          description: Invitation email mismatch
  /orders:
    post:
      security: *id001
      summary: Place a direct purchase order
      description: Reserves stock immediately, snapshots the server-selected quantity tier, and waits up to 72 hours for Seller confirmation. Payment is not initiated by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, quantity, requestKey]
              additionalProperties: false
              properties:
                listingId: { type: string, format: uuid }
                quantity: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,3})?$' }
                requestKey: { type: string, format: uuid }
      responses:
        "201": { description: Order created and inventory reserved. }
        "400": { description: Quantity, MOQ, or request body is invalid. }
        "401": { description: Authentication required. }
        "409":
          {
            description: Listing unavailable,
            stock changed,
            or idempotency key was reused with different data.,
          }
  /orders/mine:
    get:
      security: *id001
      summary: List the authenticated Buyer's orders
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          { description: Paginated orders belonging to the signed-in user. }
        "401": { description: Authentication required. }
  /orders/{orderId}/checkout:
    post:
      security: *id001
      summary: Start RapidGateway hosted checkout for a confirmed Buyer order
      description: The backend uses the immutable order amount. Only a verified signed webhook can mark an order paid; browser return is informational.
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey, mobile]
              additionalProperties: false
              properties:
                requestKey: { type: string, format: uuid }
                mobile: { type: string, pattern: "^03[0-9]{9}$" }
                testScenario:
                  type: string
                  enum:
                    [
                      SUCCESS,
                      FAILED,
                      PENDING,
                      EXPIRED,
                      INSUFFICIENT_BALANCE,
                      INVALID_OTP,
                      TIMEOUT,
                      DUPLICATE,
                    ]
      responses:
        "201":
          { description: Hosted checkout URL and payment attempt returned. }
        "401": { description: Authentication required. }
        "409":
          {
            description: Order is not awaiting payment or attempt key was already used.,
          }
        "503":
          {
            description: Gateway credentials or webhook configuration are missing.,
          }
  /payment-attempts/{attemptId}:
    get:
      security: *id001
      summary: Read the signed-in Buyer's payment attempt status
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Payment and order status. }
        "401": { description: Authentication required. }
        "404": { description: Attempt not found for this Buyer. }
  /rapidgateway/webhook:
    post:
      summary: Receive signed RapidGateway transaction notifications
      description: Verifies the raw-body HMAC and timestamp; duplicate event IDs are safe to retry. Refund and payout events are acknowledged but not processed.
      parameters:
        - in: header
          name: X-RapidGateway-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-RapidGateway-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: X-RapidGateway-Event
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          {
            description: Event accepted or safely ignored as a duplicate/unsupported event.,
          }
        "400": { description: Invalid event payload or payment details. }
        "401": { description: Signature or timestamp validation failed. }
  /organizations/{organizationId}/orders:
    get:
      security: *id001
      summary: List Seller orders
      description: Available to the Owner and Managers granted orders.confirm; Staff have no order access.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Paginated organization orders. }
        "403": { description: Seller order access permission required. }
  /organizations/{organizationId}/orders/{orderId}/decision:
    post:
      security: *id001
      summary: Confirm or reject a direct order
      description: Confirmation starts the Buyer's 72-hour payment deadline; rejection releases reserved stock. Orders past the 72-hour Seller response deadline expire and release stock.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [confirm, reject] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Order decision recorded. }
        "403":
          {
            description: Owner access or Manager orders.confirm permission required.,
          }
        "409": { description: Order is no longer awaiting Seller decision. }
  /organizations/{organizationId}/purchase-groups:
    get:
      security: *id001
      summary: List groups managed by the Seller organization
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Paginated groups and joined quantity. }
        "403": { description: Active Owner or Manager access required. }
    post:
      security: *id001
      summary: Create a group offer for a listing
      description: Owner or Manager creates a group target and deadline. The target must fit current available stock; shares reserve stock only as Buyers join.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, targetQuantity, closesAt, requestKey]
              additionalProperties: false
              properties:
                listingId: { type: string, format: uuid }
                targetQuantity:
                  { type: string, pattern: '^[0-9]+(\\.[0-9]{1,3})?$' }
                closesAt: { type: string, format: date-time }
                requestKey: { type: string, format: uuid }
      responses:
        "201": { description: Group created. }
        "403": { description: Active Owner or Manager access required. }
        "409":
          {
            description: Listing does not allow groups or target exceeds current stock.,
          }
  /organizations/{organizationId}/purchase-groups/{groupId}/decision:
    post:
      security: *id001
      summary: Confirm or expire a group
      description: Owner or Manager with orders.confirm may confirm when target is met. At deadline, confirm accepts all current shares unchanged; expire releases all unpaid shares.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [confirm, expire] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Group decision recorded. }
        "403":
          {
            description: Owner access or Manager orders.confirm permission required.,
          }
        "409":
          { description: Target/deadline/state does not permit this decision. }
  /listings/{listingId}/purchase-groups:
    get:
      summary: Browse joinable groups for a published listing
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          { description: Paginated joinable groups with contribution totals. }
  /purchase-groups/{groupId}:
    get:
      security: *id001
      summary: Read a joinable group and the signed-in Buyer's contributions
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Group details and own contribution history. }
        "404": { description: Group is unavailable. }
  /purchase-groups/{groupId}/contributions:
    post:
      security: *id001
      summary: Join a group with a quantity share
      description: Reserves stock immediately, selects the price tier using this Buyer's share, and does not request payment before Seller confirmation.
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, requestKey]
              additionalProperties: false
              properties:
                quantity: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,3})?$' }
                requestKey: { type: string, format: uuid }
      responses:
        "201": { description: Contribution created and inventory reserved. }
        "409":
          { description: Group closed, target exceeded, or stock unavailable. }
  /purchase-groups/{groupId}/contributions/{orderId}/leave:
    post:
      security: *id001
      summary: Withdraw the Buyer's share before Seller confirmation
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Contribution withdrawn and reservation released. }
        "404": { description: The contribution does not belong to this Buyer. }
        "409":
          {
            description: Seller has confirmed the group or contribution is no longer open.,
          }
  /listings:
    get:
      summary: Search published listings with q, material, unit, page, limit, and sort
      responses:
        "200":
          description: Paginated public listings
      description:
        Only published stock from active organizations; keyword/material/unit/sort, page
        1–200, limit 1–50; consistent count and rows.
  /listings/{listingId}:
    get:
      summary: Get a published listing by ID
      responses:
        "200":
          description: Published listing
        "404":
          description: Not published or not found
    parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings:
    get:
      security: *id001
      summary: Get seller organization listings, including drafts
      responses:
        "200":
          description: Own organization listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "403":
          description: Owner or Manager access required
        "422":
          $ref: "#/components/responses/Validation"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      description:
        Returns data {items,total,page,limit}; page 1–200, limit 1–50 (default 20). Unknown
        query fields are rejected. Count and rows share one database snapshot; access is server-scoped.
    post:
      security: *id001
      summary: Create a draft listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Draft created
        "403":
          description: Owner or Manager access required
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/{listingId}:
    put:
      security: *id001
      summary: Edit a draft or rejected listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingEdit"
      responses:
        "200":
          description: Draft updated
        "409":
          description: Listing not editable
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/{listingId}/submit:
    post:
      security: *id001
      summary: Submit a draft for platform review
      responses:
        "200":
          description: Pending review
        "409":
          description: Listing not submittable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Version"
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/import/template:
    get:
      security: *id001
      summary: Download CSV stock sheet template
      responses:
        "200":
          description: CSV template
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/import/preview:
    post:
      security: *id001
      summary: Validate a CSV or XLSX upload with row-level errors, without saving it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Valid rows and row-level errors
        "413":
          description: File exceeds upload limit
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/import/commit:
    post:
      security: *id001
      summary: Atomically create reviewed draft listings with a UUID idempotency key
      responses:
        "201":
          description: Drafts created
        "200":
          description: Same import was already committed
        "409":
          description: Import key reused with different rows
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /platform/listings/pending:
    get:
      security: *id001
      summary: Platform Admin review queue
      responses:
        "200":
          description: Pending listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "422":
          $ref: "#/components/responses/Validation"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      description:
        Returns data {items,total,page,limit}; page 1–200, limit 1–50 (default 20). Unknown
        query fields are rejected. Count and rows share one database snapshot; access is server-scoped.
  /platform/listings/{listingId}/review:
    post:
      security: *id001
      summary: Publish or reject a pending listing
      responses:
        "200":
          description: Review recorded
        "403":
          description: Platform Admin required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Review"
    parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /requirements:
    get:
      security: *id001
      summary: View your buyer requirements
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "422":
          $ref: "#/components/responses/Validation"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      description:
        Returns data {items,total,page,limit}; page 1–200, limit 1–50 (default 20). Unknown
        query fields are rejected. Count and rows share one database snapshot; access is server-scoped.
    post:
      security: *id001
      summary: Create a buyer requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementInput"
      responses:
        "201":
          description: Requirement saved
  /requirements/{requirementId}/matches:
    get:
      security: *id001
      summary: Explainably match your requirement to published listings
      responses:
        "200":
          description: Matching listings and MOQ suitability
        "404":
          description: Not your active requirement
    parameters:
      - name: requirementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/{listingId}/archive:
    post:
      summary: Archive stock permanently from discovery, retaining audit history
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Version"
      responses: &id006
        "200":
          description: Action completed; updated data and version
        "401": &id002
          description: Sign in with active verified account and live session
        "403": &id003
          description: Required permission unavailable
        "409": &id004
          description: Stale version or invalid state
        "422": &id005
          description: Invalid input
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/{listingId}/images:
    post:
      summary: Upload draft/rejected listing raster, at most eight images
      security: *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - altText
                - version
              properties:
                file:
                  type: string
                  format: binary
                altText:
                  type: string
                  minLength: 1
                  maxLength: 200
                version:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Re-encoded WebP image metadata
        "413":
          description: Upload limit exceeded
        "401": *id002
        "403": *id003
        "409": *id004
        "422": *id005
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/listings/{listingId}/images/{imageId}:
    delete:
      summary: Remove image metadata and queue private-object cleanup
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Version"
      responses: *id006
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /listing-images/{imageId}:
    get:
      summary:
        Request a 60-second private image URL; published active seller images are public,
        others require seller/reviewer access
      responses:
        "200":
          description: URL and expiresIn; response is not cached
        "404":
          description: Image unavailable
        "503":
          description: Storage not configured or unavailable
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /requirements/{requirementId}/status:
    patch:
      summary: Pause, resume or terminally close an owned requirement
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementStatus"
      responses: *id006
    parameters:
      - name: requirementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /analytics/buyer-impact:
    get:
      summary: Read the authenticated Buyer's order activity and paid material volume
      description: Excludes demo listings. Paid order quantity is not represented as verified environmental diversion.
      security: *id001
      responses:
        "200":
          description: Summary metrics and up to ten recent Buyer orders
        "401":
          description: Authentication required
  /organizations/{organizationId}/analytics:
    get:
      summary: Read Seller listing and order activity for an organization
      description: Available to Owners and Managers granted orders.confirm. Demo listings are excluded.
      security: *id001
      responses:
        "200":
          description: Listing counts, order counts, recorded paid value, and monthly order totals
        "403":
          description: Organization role or permission is insufficient
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /organizations/{organizationId}/settings:
    get:
      summary: Read organization profile settings
      security: *id001
      responses:
        "200":
          description: Organization name, immutable slug, status and current role
        "403":
          description: Active organization membership required
    patch:
      summary: Update the organization name
      description: Owner-only. Writes an audit event; workspace slug remains unchanged.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 180
      responses:
        "200":
          description: Updated organization profile
        "403":
          description: Owner access required
        "422":
          $ref: "#/components/responses/Validation"
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /platform/organizations:
    get:
      summary: List organizations for the Platform Admin directory
      description: Includes demo organizations, explicitly identified in each result.
      security: *id001
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated organization records with member and listing counts
        "403":
          description: Platform Admin access required
  /platform/users:
    get:
      summary: List user accounts for the Platform Admin directory
      description: Includes demo users, explicitly identified in each result.
      security: *id001
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated account status, verification and workspace role records
        "403":
          description: Platform Admin access required
  /platform/analytics:
    get:
      summary: Read live Platform Admin operational metrics
      description: Aggregate metrics exclude demo accounts, organizations and listings. Paid order values are recorded order states, not settlement.
      security: *id001
      responses:
        "200":
          description: Live account, organization, listing, order, seller application and audit activity counts
        "403":
          description: Platform Admin access required
components:
  securitySchemes:
    cronAuth:
      type: http
      scheme: bearer
      description: Backend-only CRON_SECRET sent by the scheduler; never a user access token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GoogleCredential:
      type: object
      required:
        - credential
        - nonce
      properties:
        credential:
          type: string
          minLength: 100
          maxLength: 8192
          description: Google Identity Services ID token; send only over HTTPS and never persist it.
        nonce:
          type: string
          minLength: 32
          maxLength: 200
          description: The matching single-use nonce issued by this API and included in the verified Google ID token.
      additionalProperties: false
    SellerGoogleCredential:
      type: object
      required: [credential, nonce]
      properties:
        credential:
          type: string
          minLength: 100
          maxLength: 8192
          description: Google Identity Services ID token; send only over HTTPS and never persist it.
        nonce:
          type: string
          minLength: 32
          maxLength: 200
          description: The matching Seller-specific single-use nonce issued by this API.
        organizationName:
          type: string
          minLength: 2
          maxLength: 180
          description: Required for first-time Seller registration; omitted for subsequent sign-ins.
      additionalProperties: false
    ListingInput:
      type: object
      required:
        - title
        - description
        - material
        - condition
        - unit
        - quantity
        - minOrderQuantity
        - pricePerUnit
      properties:
        title: &id009
          type: string
          minLength: 3
          maxLength: 160
        description: &id010
          type: string
          minLength: 20
          maxLength: 5000
        material: &id011
          type: string
          minLength: 2
          maxLength: 80
        condition: &id012
          type: string
          minLength: 2
          maxLength: 80
        unit: &id013
          type: string
          enum:
            - kg
            - meter
            - roll
            - piece
        quantity: &id007
          oneOf:
            - type: string
              pattern: ^(?:0|[1-9]\d{0,8})(?:\.\d{1,3})?$
            - type: number
              exclusiveMinimum: 0
              maximum: 100000000
          description:
            Prefer exact decimal text; at most 3 fractional digits. No rounding or exponent
            text.
        minOrderQuantity: &id014
          oneOf:
            - type: string
              pattern: ^(?:0|[1-9]\d{0,8})(?:\.\d{1,3})?$
            - type: number
              exclusiveMinimum: 0
              maximum: 100000000
          description:
            Prefer exact decimal text; at most 3 fractional digits. No rounding or exponent
            text.
        pricePerUnit: &id008
          oneOf:
            - type: string
              pattern: ^(?:0|[1-9]\d{0,8})(?:\.\d{1,2})?$
            - type: number
              exclusiveMinimum: 0
              maximum: 100000000
          description:
            Prefer exact decimal text; at most 2 fractional digits. No rounding or exponent
            text.
        purchaseMode:
          type: string
          enum: [direct, group, both]
          description: Purchase modes enabled for this listing; omitted on create defaults to direct and omitted on edit preserves the current mode.
        color: &id015
          type: string
          maxLength: 80
          default: ""
        composition: &id016
          type: string
          maxLength: 200
          default: ""
        location: &id017
          type: string
          maxLength: 180
          default: ""
        priceTiers: &id018
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PriceTier"
          description: Increasing thresholds from MOQ to available stock; nonincreasing unit prices.
      additionalProperties: false
    RequirementInput:
      type: object
      required:
        - material
        - minQuantity
        - unit
      properties:
        material:
          type: string
          minLength: 2
          maxLength: 80
        minQuantity: *id007
        unit:
          type: string
          enum:
            - kg
            - meter
            - roll
            - piece
        maxPricePerUnit: *id008
        notes:
          type: string
          maxLength: 1000
      additionalProperties: false
    Registration:
      oneOf:
        - type: object
          required:
            - accountType
            - fullName
            - email
            - password
          properties:
            accountType:
              const: buyer
            fullName:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 10
      description:
        Passwords require 10–72 UTF-8 bytes and uppercase/lowercase/digit; unknown fields
        rejected. No default credentials.
    Token:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 32
    PriceTier:
      type: object
      additionalProperties: false
      required:
        - minQuantity
        - pricePerUnit
      properties:
        minQuantity: *id007
        pricePerUnit: *id008
        purchaseMode:
          type: string
          enum: [direct, group, both]
    Version:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    ListingEdit:
      type: object
      required:
        - title
        - description
        - material
        - condition
        - unit
        - quantity
        - minOrderQuantity
        - pricePerUnit
        - version
      properties:
        title: *id009
        description: *id010
        material: *id011
        condition: *id012
        unit: *id013
        quantity: *id007
        minOrderQuantity: *id014
        pricePerUnit: *id008
        color: *id015
        composition: *id016
        location: *id017
        priceTiers: *id018
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    RequirementStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - active
            - paused
            - closed
        version:
          type: integer
          minimum: 1
    Review:
      type: object
      additionalProperties: false
      required:
        - decision
        - reason
        - version
      properties:
        decision:
          type: string
          enum:
            - published
            - rejected
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        version:
          type: integer
          minimum: 1
    CollectionResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - total
            - page
            - limit
          properties:
            items:
              type: array
              items:
                type: object
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 50
  responses:
    Conflict:
      description: Resource already exists
    Validation:
      description: Submitted fields are invalid
    BadToken:
      description: Token is invalid
      consumed: null
      or expired: null
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
