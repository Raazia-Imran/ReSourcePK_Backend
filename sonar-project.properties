# Classify executable test suites as tests, retaining them in analysis without
# treating repeated assertion fixtures as duplicated application code.
sonar.sources=src,scripts,migrations,contracts/contracts,contracts/scripts,contracts/ignition
sonar.tests=test,integration,e2e,contracts/test
# Applied PostgreSQL DDL repeats enum/check values intentionally.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=sql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=migrations/**/*.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=migrations/**/*.sql
# Serialize wallet nonces and bounded idle/recovery waits. Parallel processing
# here would change outbox transaction ordering and wallet nonce behavior.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e3.resourceKey=src/worker/index.js
# The example contract test intentionally observes sequential increments.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e4.resourceKey=contracts/test/Counter.ts
# Automatic analysis does not apply test classification to these suites.
# Repeated setup/expected rows are deliberate independent test fixtures. Keep
# their issue/security analysis; exclude only fixture duplication measurements.
sonar.cpd.exclusions=test/**/*.test.js,integration/**/*.test.js,e2e/**/*.spec.js,contracts/test/**/*.ts
